<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.4); opacity: 0; }
        }
        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .pulse-ring {
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        .pulse-dot {
            animation: pulse-dot 1.5s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .spinner {
            animation: spin 1s linear infinite;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .gradient-bg-dark {
            background: linear-gradient(135deg, #4c51bf 0%, #553c9a 100%);
        }
    </style>
</head>
<body class="min-h-screen bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // Icons as SVG components
        const MicrophoneIcon = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
            </svg>
        );

        const StopIcon = ({ className }) => (
            <svg className={className} fill="currentColor" viewBox="0 0 24 24">
                <rect x="6" y="6" width="12" height="12" rx="2" />
            </svg>
        );

        const ClockIcon = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const SunIcon = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
        );

        const CalendarIcon = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
        );

        const TrashIcon = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
        );

        const CheckIcon = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
            </svg>
        );

        const SparklesIcon = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
            </svg>
        );

        const DownloadIcon = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
        );

        const ArrowLeftIcon = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
        );

        // Loading Spinner Component
        const LoadingSpinner = () => (
            <div className="flex flex-col items-center justify-center py-12">
                <div className="w-16 h-16 border-4 border-indigo-200 border-t-indigo-600 rounded-full spinner"></div>
                <p className="mt-4 text-gray-600 font-medium">Analyzing your conversation...</p>
                <p className="text-sm text-gray-400 mt-1">Extracting tasks with AI</p>
            </div>
        );

        // Voice Input Screen Component
        const VoiceInputScreen = ({ onGenerateTasks, transcript, setTranscript }) => {
            const [isRecording, setIsRecording] = useState(false);
            const [currentSpeech, setCurrentSpeech] = useState('');
            const [error, setError] = useState(null);
            const [speechSupported, setSpeechSupported] = useState(true);
            const recognitionRef = useRef(null);

            useEffect(() => {
                // Check for Web Speech API support
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    setSpeechSupported(false);
                    return;
                }

                const recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'en-US';

                recognition.onresult = (event) => {
                    let interimTranscript = '';
                    let finalTranscript = '';

                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const result = event.results[i];
                        if (result.isFinal) {
                            finalTranscript += result[0].transcript + ' ';
                        } else {
                            interimTranscript += result[0].transcript;
                        }
                    }

                    if (finalTranscript) {
                        setTranscript(prev => prev + finalTranscript);
                        setCurrentSpeech('');
                    } else {
                        setCurrentSpeech(interimTranscript);
                    }
                };

                recognition.onerror = (event) => {
                    console.error('Speech recognition error:', event.error);
                    if (event.error === 'not-allowed') {
                        setError('Microphone access denied. Please allow microphone permissions.');
                    } else if (event.error === 'no-speech') {
                        // Auto-restart on no speech detected
                        if (isRecording) {
                            recognition.start();
                        }
                    } else {
                        setError(`Speech recognition error: ${event.error}`);
                    }
                };

                recognition.onend = () => {
                    // Auto-restart if still recording
                    if (recognitionRef.current && isRecording) {
                        try {
                            recognition.start();
                        } catch (e) {
                            console.log('Recognition restart failed:', e);
                        }
                    }
                };

                recognitionRef.current = recognition;

                return () => {
                    if (recognitionRef.current) {
                        recognitionRef.current.stop();
                    }
                };
            }, [isRecording, setTranscript]);

            const toggleRecording = async () => {
                setError(null);

                if (isRecording) {
                    setIsRecording(false);
                    if (recognitionRef.current) {
                        recognitionRef.current.stop();
                    }
                } else {
                    try {
                        // Request microphone permission
                        await navigator.mediaDevices.getUserMedia({ audio: true });
                        setIsRecording(true);
                        if (recognitionRef.current) {
                            recognitionRef.current.start();
                        }
                    } catch (err) {
                        setError('Could not access microphone. Please check permissions.');
                        console.error('Microphone access error:', err);
                    }
                }
            };

            const handleTextChange = (e) => {
                setTranscript(e.target.value);
            };

            return (
                <div className="min-h-screen gradient-bg flex flex-col">
                    {/* Header */}
                    <header className="pt-8 pb-4 px-4 text-center">
                        <h1 className="text-3xl md:text-4xl font-bold text-white mb-2">
                            Voice Task Manager
                        </h1>
                        <p className="text-indigo-200 text-lg">
                            Speak your tasks, let AI organize them
                        </p>
                    </header>

                    {/* Main Content */}
                    <main className="flex-1 flex flex-col items-center px-4 py-6 max-w-2xl mx-auto w-full">
                        {/* Error Display */}
                        {error && (
                            <div className="w-full mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg">
                                {error}
                            </div>
                        )}

                        {/* Microphone Button */}
                        <div className="relative mb-8">
                            {isRecording && (
                                <>
                                    <div className="absolute inset-0 rounded-full bg-red-500 opacity-75 pulse-ring"></div>
                                    <div className="absolute inset-0 rounded-full bg-red-400 opacity-50 pulse-ring" style={{animationDelay: '0.5s'}}></div>
                                </>
                            )}
                            <button
                                onClick={toggleRecording}
                                disabled={!speechSupported}
                                className={`relative z-10 w-24 h-24 md:w-32 md:h-32 rounded-full flex items-center justify-center transition-all duration-300 shadow-2xl ${
                                    isRecording
                                        ? 'bg-red-500 hover:bg-red-600 pulse-dot'
                                        : 'bg-white hover:bg-gray-100'
                                } ${!speechSupported ? 'opacity-50 cursor-not-allowed' : ''}`}
                            >
                                {isRecording ? (
                                    <StopIcon className="w-12 h-12 md:w-16 md:h-16 text-white" />
                                ) : (
                                    <MicrophoneIcon className="w-12 h-12 md:w-16 md:h-16 text-indigo-600" />
                                )}
                            </button>
                        </div>

                        {/* Recording Status */}
                        <div className="text-center mb-6">
                            {isRecording ? (
                                <p className="text-white font-medium text-lg animate-pulse">
                                    🔴 Recording... Speak your tasks
                                </p>
                            ) : (
                                <p className="text-indigo-200">
                                    {speechSupported
                                        ? 'Tap the microphone to start recording'
                                        : 'Voice input not supported in this browser. Please type below.'}
                                </p>
                            )}
                        </div>

                        {/* Current Speech (Real-time) */}
                        {currentSpeech && (
                            <div className="w-full mb-4 p-4 bg-white/20 backdrop-blur-sm rounded-lg">
                                <p className="text-white italic">"{currentSpeech}"</p>
                            </div>
                        )}

                        {/* Transcript Area */}
                        <div className="w-full bg-white rounded-xl shadow-xl overflow-hidden">
                            <div className="p-4 bg-gray-50 border-b">
                                <h3 className="font-semibold text-gray-700">Your Conversation</h3>
                            </div>
                            <textarea
                                value={transcript}
                                onChange={handleTextChange}
                                placeholder="Your voice input will appear here... Or type your tasks manually.

Example: 'Tomorrow I need to finish the quarterly report by noon. Also, don't forget to call the client about the new proposal. I should probably schedule a team meeting for next week to discuss the project timeline.'"
                                className="w-full h-48 md:h-64 p-4 text-gray-700 resize-none focus:outline-none"
                            />
                        </div>

                        {/* Generate Button */}
                        <button
                            onClick={() => onGenerateTasks(transcript)}
                            disabled={!transcript.trim()}
                            className={`mt-6 px-8 py-4 rounded-xl font-semibold text-lg shadow-lg transition-all duration-300 flex items-center gap-3 ${
                                transcript.trim()
                                    ? 'bg-white text-indigo-600 hover:bg-gray-100 hover:shadow-xl transform hover:-translate-y-1'
                                    : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                            }`}
                        >
                            <SparklesIcon className="w-6 h-6" />
                            Generate Task List
                        </button>

                        {/* Instructions */}
                        <div className="mt-8 text-center text-indigo-200 text-sm max-w-md">
                            <p>💡 Tip: Speak naturally about your tasks, meetings, and to-dos.
                            Our AI will extract and organize them for you.</p>
                        </div>
                    </main>
                </div>
            );
        };

        // Task Card Component
        const TaskCard = ({ task, onToggleComplete, onDelete, onUpdateSchedule }) => {
            const priorityColors = {
                high: 'bg-red-50 border-red-200',
                medium: 'bg-yellow-50 border-yellow-200',
                low: 'bg-blue-50 border-blue-200'
            };

            const priorityBadgeColors = {
                high: 'bg-red-500',
                medium: 'bg-yellow-500',
                low: 'bg-blue-500'
            };

            const suggestedTimeIcons = {
                morning: '🌅',
                afternoon: '☀️',
                evening: '🌙'
            };

            return (
                <div className={`rounded-xl border-2 p-4 transition-all duration-300 ${priorityColors[task.priority]} ${
                    task.scheduledDate ? 'ring-2 ring-green-400 ring-offset-2' : ''
                } ${task.completed ? 'opacity-60' : ''}`}>
                    <div className="flex items-start gap-3">
                        {/* Checkbox */}
                        <button
                            onClick={() => onToggleComplete(task.id)}
                            className={`w-6 h-6 rounded-full border-2 flex-shrink-0 flex items-center justify-center transition-all ${
                                task.completed
                                    ? 'bg-green-500 border-green-500'
                                    : 'border-gray-300 hover:border-green-400'
                            }`}
                        >
                            {task.completed && <CheckIcon className="w-4 h-4 text-white" />}
                        </button>

                        {/* Content */}
                        <div className="flex-1 min-w-0">
                            <div className="flex items-center gap-2 mb-1">
                                <h3 className={`font-semibold text-gray-800 ${task.completed ? 'line-through' : ''}`}>
                                    {task.title}
                                </h3>
                                <span className={`px-2 py-0.5 rounded-full text-xs text-white ${priorityBadgeColors[task.priority]}`}>
                                    {task.priority}
                                </span>
                                {task.scheduledDate && (
                                    <span className="px-2 py-0.5 rounded-full text-xs bg-green-500 text-white">
                                        Scheduled
                                    </span>
                                )}
                            </div>
                            <p className="text-gray-600 text-sm mb-3">{task.description}</p>

                            {/* Meta Info */}
                            <div className="flex flex-wrap items-center gap-4 text-sm text-gray-500 mb-3">
                                <span className="flex items-center gap-1">
                                    <ClockIcon className="w-4 h-4" />
                                    {task.estimatedDuration} min
                                </span>
                                <span className="flex items-center gap-1">
                                    <SunIcon className="w-4 h-4" />
                                    {suggestedTimeIcons[task.suggestedTime]} {task.suggestedTime}
                                </span>
                            </div>

                            {/* Schedule Inputs */}
                            <div className="flex flex-wrap gap-2 items-center">
                                <input
                                    type="date"
                                    value={task.scheduledDate || ''}
                                    onChange={(e) => onUpdateSchedule(task.id, e.target.value, task.scheduledTime)}
                                    className="px-3 py-1.5 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                                />
                                <input
                                    type="time"
                                    value={task.scheduledTime || ''}
                                    onChange={(e) => onUpdateSchedule(task.id, task.scheduledDate, e.target.value)}
                                    className="px-3 py-1.5 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                                />
                            </div>
                        </div>

                        {/* Delete Button */}
                        <button
                            onClick={() => onDelete(task.id)}
                            className="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors"
                        >
                            <TrashIcon className="w-5 h-5" />
                        </button>
                    </div>
                </div>
            );
        };

        // Task Management Screen Component
        const TaskManagementScreen = ({ tasks, setTasks, onBack }) => {
            const toggleComplete = (id) => {
                setTasks(prev => prev.map(task =>
                    task.id === id ? { ...task, completed: !task.completed } : task
                ));
            };

            const deleteTask = (id) => {
                setTasks(prev => prev.filter(task => task.id !== id));
            };

            const updateSchedule = (id, date, time) => {
                setTasks(prev => prev.map(task =>
                    task.id === id ? { ...task, scheduledDate: date, scheduledTime: time } : task
                ));
            };

            const autoScheduleAll = () => {
                const today = new Date();
                let currentDate = new Date(today);
                let currentHour = 9; // Start at 9 AM
                let currentMinute = 0;

                const updatedTasks = tasks.map(task => {
                    // Skip already scheduled tasks
                    if (task.scheduledDate && task.scheduledTime) {
                        return task;
                    }

                    // Calculate end time of this task
                    const taskDuration = task.estimatedDuration + 15; // Add 15-min buffer
                    let endMinute = currentMinute + taskDuration;
                    let endHour = currentHour + Math.floor(endMinute / 60);
                    endMinute = endMinute % 60;

                    // If task would end after 6 PM, move to next day
                    if (endHour >= 18) {
                        currentDate.setDate(currentDate.getDate() + 1);
                        currentHour = 9;
                        currentMinute = 0;
                        endMinute = currentMinute + taskDuration;
                        endHour = currentHour + Math.floor(endMinute / 60);
                        endMinute = endMinute % 60;
                    }

                    const scheduledDate = currentDate.toISOString().split('T')[0];
                    const scheduledTime = `${String(currentHour).padStart(2, '0')}:${String(currentMinute).padStart(2, '0')}`;

                    // Update current time for next task
                    currentHour = endHour;
                    currentMinute = endMinute;

                    return {
                        ...task,
                        scheduledDate,
                        scheduledTime
                    };
                });

                setTasks(updatedTasks);
            };

            const exportToCalendar = () => {
                const scheduledTasks = tasks.filter(t => t.scheduledDate && t.scheduledTime);

                if (scheduledTasks.length === 0) {
                    alert('No scheduled tasks to export. Please schedule your tasks first.');
                    return;
                }

                let icsContent = [
                    'BEGIN:VCALENDAR',
                    'VERSION:2.0',
                    'PRODID:-//Voice Task Manager//EN',
                    'CALSCALE:GREGORIAN',
                    'METHOD:PUBLISH'
                ];

                scheduledTasks.forEach(task => {
                    const startDate = new Date(`${task.scheduledDate}T${task.scheduledTime}`);
                    const endDate = new Date(startDate.getTime() + task.estimatedDuration * 60000);

                    const formatDate = (date) => {
                        return date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
                    };

                    const uid = `${Date.now()}-${task.id}@voicetaskmanager`;

                    icsContent.push(
                        'BEGIN:VEVENT',
                        `UID:${uid}`,
                        `DTSTAMP:${formatDate(new Date())}`,
                        `DTSTART:${formatDate(startDate)}`,
                        `DTEND:${formatDate(endDate)}`,
                        `SUMMARY:${task.title}`,
                        `DESCRIPTION:${task.description}\\n\\nPriority: ${task.priority}\\nEstimated Duration: ${task.estimatedDuration} minutes`,
                        `PRIORITY:${task.priority === 'high' ? 1 : task.priority === 'medium' ? 5 : 9}`,
                        'END:VEVENT'
                    );
                });

                icsContent.push('END:VCALENDAR');

                const blob = new Blob([icsContent.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'tasks.ics';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

            const completedCount = tasks.filter(t => t.completed).length;
            const scheduledCount = tasks.filter(t => t.scheduledDate && t.scheduledTime).length;

            return (
                <div className="min-h-screen bg-gray-100">
                    {/* Header */}
                    <header className="gradient-bg-dark text-white py-6 px-4 shadow-lg">
                        <div className="max-w-4xl mx-auto">
                            <button
                                onClick={onBack}
                                className="flex items-center gap-2 text-indigo-200 hover:text-white mb-4 transition-colors"
                            >
                                <ArrowLeftIcon className="w-5 h-5" />
                                Back to Recording
                            </button>
                            <h1 className="text-2xl md:text-3xl font-bold">Your Tasks</h1>
                            <p className="text-indigo-200 mt-1">
                                {completedCount}/{tasks.length} completed • {scheduledCount} scheduled
                            </p>
                        </div>
                    </header>

                    {/* Action Buttons */}
                    <div className="max-w-4xl mx-auto px-4 py-4">
                        <div className="flex flex-wrap gap-3">
                            <button
                                onClick={autoScheduleAll}
                                className="flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors shadow-md"
                            >
                                <CalendarIcon className="w-5 h-5" />
                                Auto-Schedule All
                            </button>
                            <button
                                onClick={exportToCalendar}
                                className="flex items-center gap-2 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors shadow-md"
                            >
                                <DownloadIcon className="w-5 h-5" />
                                Export to Calendar
                            </button>
                        </div>
                    </div>

                    {/* Task List */}
                    <main className="max-w-4xl mx-auto px-4 pb-8">
                        {tasks.length === 0 ? (
                            <div className="text-center py-12">
                                <div className="text-6xl mb-4">📝</div>
                                <h3 className="text-xl font-semibold text-gray-600">No tasks yet</h3>
                                <p className="text-gray-400">Go back and record your tasks</p>
                            </div>
                        ) : (
                            <div className="space-y-4">
                                {tasks.map(task => (
                                    <TaskCard
                                        key={task.id}
                                        task={task}
                                        onToggleComplete={toggleComplete}
                                        onDelete={deleteTask}
                                        onUpdateSchedule={updateSchedule}
                                    />
                                ))}
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            const [screen, setScreen] = useState('voice'); // 'voice' or 'tasks'
            const [transcript, setTranscript] = useState('');
            const [tasks, setTasks] = useState([]);
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState(null);
            const [apiKey, setApiKey] = useState(() => localStorage.getItem('anthropic_api_key') || '');
            const [showApiKeyModal, setShowApiKeyModal] = useState(false);

            const generateTasks = async (text) => {
                if (!text.trim()) return;

                // Check for API key
                if (!apiKey) {
                    setShowApiKeyModal(true);
                    return;
                }

                setIsLoading(true);
                setError(null);

                try {
                    const response = await fetch('https://api.anthropic.com/v1/messages', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-api-key': apiKey,
                            'anthropic-version': '2023-06-01',
                            'anthropic-dangerous-direct-browser-access': 'true'
                        },
                        body: JSON.stringify({
                            model: 'claude-sonnet-4-20250514',
                            max_tokens: 2048,
                            messages: [
                                {
                                    role: 'user',
                                    content: `Analyze this conversation and extract actionable tasks with time estimates. For each task, provide:
- title: clear task name
- description: brief description
- estimatedDuration: time in minutes (be realistic)
- priority: high, medium, or low
- suggestedTime: suggested time of day (morning, afternoon, evening)

Conversation:
${text}

Respond ONLY with a JSON array of tasks, no preamble or markdown:
[{"title": "...", "description": "...", "estimatedDuration": 30, "priority": "high", "suggestedTime": "morning"}]`
                                }
                            ]
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.error?.message || `API error: ${response.status}`);
                    }

                    const data = await response.json();
                    let content = data.content[0].text;

                    // Strip markdown code fences if present
                    content = content.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();

                    const parsedTasks = JSON.parse(content);

                    // Add unique IDs and initial state
                    const tasksWithIds = parsedTasks.map((task, index) => ({
                        ...task,
                        id: Date.now() + index,
                        completed: false,
                        scheduledDate: '',
                        scheduledTime: ''
                    }));

                    setTasks(tasksWithIds);
                    setScreen('tasks');
                } catch (err) {
                    console.error('Error generating tasks:', err);
                    setError(err.message || 'Failed to generate tasks. Please try again.');
                } finally {
                    setIsLoading(false);
                }
            };

            const handleSaveApiKey = (key) => {
                setApiKey(key);
                localStorage.setItem('anthropic_api_key', key);
                setShowApiKeyModal(false);
                // Retry generating tasks
                generateTasks(transcript);
            };

            // API Key Modal
            const ApiKeyModal = () => {
                const [tempKey, setTempKey] = useState(apiKey);

                return (
                    <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                        <div className="bg-white rounded-xl shadow-2xl max-w-md w-full p-6">
                            <h2 className="text-xl font-bold text-gray-800 mb-2">Enter Anthropic API Key</h2>
                            <p className="text-gray-600 text-sm mb-4">
                                Your API key is stored locally in your browser and never sent to any server except Anthropic's API.
                            </p>
                            <input
                                type="password"
                                value={tempKey}
                                onChange={(e) => setTempKey(e.target.value)}
                                placeholder="sk-ant-..."
                                className="w-full px-4 py-3 border rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-400"
                            />
                            <div className="flex gap-3">
                                <button
                                    onClick={() => setShowApiKeyModal(false)}
                                    className="flex-1 px-4 py-2 border rounded-lg hover:bg-gray-50 transition-colors"
                                >
                                    Cancel
                                </button>
                                <button
                                    onClick={() => handleSaveApiKey(tempKey)}
                                    disabled={!tempKey.trim()}
                                    className="flex-1 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors disabled:opacity-50"
                                >
                                    Save & Continue
                                </button>
                            </div>
                            <p className="text-xs text-gray-400 mt-4 text-center">
                                Get your API key from{' '}
                                <a href="https://console.anthropic.com/" target="_blank" className="text-indigo-600 hover:underline">
                                    console.anthropic.com
                                </a>
                            </p>
                        </div>
                    </div>
                );
            };

            if (isLoading) {
                return (
                    <div className="min-h-screen gradient-bg flex items-center justify-center">
                        <div className="bg-white rounded-xl shadow-2xl p-8 max-w-md mx-4">
                            <LoadingSpinner />
                        </div>
                    </div>
                );
            }

            return (
                <>
                    {showApiKeyModal && <ApiKeyModal />}

                    {error && (
                        <div className="fixed top-4 left-4 right-4 z-50 max-w-lg mx-auto">
                            <div className="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg shadow-lg flex justify-between items-center">
                                <span>{error}</span>
                                <button onClick={() => setError(null)} className="ml-4 font-bold">&times;</button>
                            </div>
                        </div>
                    )}

                    {screen === 'voice' ? (
                        <VoiceInputScreen
                            onGenerateTasks={generateTasks}
                            transcript={transcript}
                            setTranscript={setTranscript}
                        />
                    ) : (
                        <TaskManagementScreen
                            tasks={tasks}
                            setTasks={setTasks}
                            onBack={() => setScreen('voice')}
                        />
                    )}
                </>
            );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
